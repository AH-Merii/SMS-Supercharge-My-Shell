# Task runner for this repo: `mise tasks` lists everything, `mise run <task>` runs it.
# File tasks live in mise-tasks/. Tools are NOT declared here; a [tools] block in this file
# would shadow the global config (programs/mise/.config/mise/config.toml) whenever the cwd is
# inside the repo.
#
# Every task is a file task: they print a plan before changing anything, which an inline
# `run =` cannot do. The front door is check, switch and update, on home-manager's build
# and activation.
