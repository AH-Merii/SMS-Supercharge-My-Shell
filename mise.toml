# Task runner for this repo: `mise tasks` lists everything, `mise run <task>` runs it.
# Every task is a file task in mise-tasks/. Tools are NOT declared here; a [tools] block
# in this file would shadow the global config (base/mise/.config/mise/config.toml)
# whenever the cwd is inside the repo.
#
# Nothing is defined inline: the tasks print a plan (and check *is* the plan), which an
# inline `run =` cannot do.
