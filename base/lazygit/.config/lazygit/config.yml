gui:
  # File/branch icons need a Nerd Font; ghostty is set to FiraCode Nerd Font,
  # which is a v3 glyph set (same generation starship and ccstatusline assume).
  nerdFontsVersion: "3"

  theme:
    # One Dark palette refs:
    # bg  #282c34, fg #abb2bf, red #e06c75, green #98c379, yellow #e5c07b
    # blue #61afef, magenta #c678dd, cyan #56b6c2, gutter #4b5263, comment #5c6370
    # selection-ish bg #32363e

    activeBorderColor:
      - "#61afef"
      - bold
    inactiveBorderColor:
      - "#5c6370"

    searchingActiveBorderColor:
      - "#56b6c2"
      - bold

    optionsTextColor:
      - "#56b6c2"

    selectedLineBgColor:
      - "#32363e"
    inactiveViewSelectedLineBgColor:
      - "#4b5263"

    cherryPickedCommitFgColor:
      - "#61afef"
    cherryPickedCommitBgColor:
      - "#56b6c2"

    markedBaseCommitFgColor:
      - "#282c34"
    markedBaseCommitBgColor:
      - "#e5c07b"

    unstagedChangesColor:
      - "#e06c75"

    defaultFgColor:
      - "#abb2bf"

git:
  # lazygit never consults git's core.pager, so without this diffs render as
  # plain `git diff` output even though the git config pipes through delta.
  # delta still reads the [delta] section of the git config (syntax theme,
  # line numbers, hyperlinks); --paging=never stops it spawning less inside
  # the panel, and the lazygit-edit:// link format turns the line-number
  # hyperlinks that are already enabled globally into click-to-open-in-editor
  # instead of dead file:// URLs.
  # (Older lazygit used git.paging.pager for this; 0.64 auto-migrates that
  # key to diffRenderers and rewrites the file, so use the new form directly.)
  diffRenderers:
    - colorArg: always
      command: 'delta --dark --paging=never --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"'
