##### TPM and Plugins #####
set-environment -g TMUX_PLUGIN_MANAGER_PATH $XDG_CONFIG_HOME/tmux/plugins

# Install TPM if not found. Same tag as the tmux-plugins/tpm line below; mise-tasks/plugins
# reads its tag from that line, so bump both here.
if-shell 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run-shell 'printf " Installing Tmux Package Manager (TPM)...\n"'
  run-shell 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run-shell 'git clone --branch v3.1.0 https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run-shell '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
  run-shell 'printf " TPM installed successfully!\n"'
}

run-shell ~/.config/tmux/scripts/configure-sesh-tmux-bindings.sh

# Plugin list, pinned with TPM's `owner/repo#ref` (a branch or tag: TPM passes it to
# `git clone -b`, so a commit SHA will not work). To bump, edit the ref, delete
# ~/.config/tmux/plugins/<name> and run `mise run plugins` (or prefix + I): TPM's update
# is a `git pull`, which does nothing on a tag checkout. See README "Pins".
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'fcsonline/tmux-thumbs#0.8.0'
set -g @plugin 'tmux-plugins/tmux-sensible#v3.0.0'
set -g @plugin 'tmux-plugins/tmux-battery#v2.0.0'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name#v3.2.1'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'
# No tags upstream and TPM cannot pin a SHA, so these track the default branch.
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @plugin 'omerxx/tmux-floax'

# Make sure to install catpuccine/tmux manually if not found
if-shell 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/catppuccin" -o -z "$(ls -A "${TMUX_PLUGIN_MANAGER_PATH}/catppuccin" 2>/dev/null)"' {
  run-shell 'printf "  Installing Catppuccin Theme...\n"'
  run-shell 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}/catppuccin"'
  run-shell 'git clone --branch v2.3.0 https://github.com/catppuccin/tmux.git "${TMUX_PLUGIN_MANAGER_PATH}/catppuccin/tmux"'
  run-shell 'printf "  Catppuccin installed successfully!\n"'
}

# Catppuccin theme
source-file ~/.config/tmux/theme.tmux.conf

# Plugin configs
# Floating Terminal
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'f'
set -g @floax-change-path 'true'

set -g status-interval 3 # change status interval to update more frequently

# Continuum
# Automatically restore sessions using continuum after killing tmux server
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-bash-history 'on'
set -g @resurrect-dir $XDG_CONFIG_HOME/tmux/resurrect
set -g @resurrect-strategy-vim 'session'

# Run TPM
run $TMUX_PLUGIN_MANAGER_PATH/tpm/tpm
