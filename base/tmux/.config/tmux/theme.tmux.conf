# Catppuccin theme
set -g @catppuccin_flavor "frappe"

# The colours are the terminal's palette (ghostty/themes/OneDark). Everything Catppuccin's
# status line draws reads a @thm_* variable, and the flavour file fills only the ones
# still unset, so naming them all by slot here means its own hex never applies and the
# status line follows whatever the terminal shows. Catppuccin's roles onto One Dark's
# sixteen: the surfaces and overlays onto the two greys, the pinks onto magenta, peach
# onto slot 16 (orange), the blues onto blue and cyan; crust and mantle, the dark text
# on coloured tabs, onto slot 21 (the background) so it stays readable. The flavour
# file sets its variables with `set -ogq`, and v2.3.0 has these 26; after a plugin
# update, check nothing new appeared:
#   grep -rhoE '@thm_[a-z_0-9]+' ~/.config/tmux/plugins/catppuccin/tmux | sort -u
set -g @thm_bg default
set -g @thm_fg white
set -g @thm_crust colour21
set -g @thm_mantle colour21
set -g @thm_surface_0 black
set -g @thm_surface_1 brightblack
set -g @thm_surface_2 brightblack
set -g @thm_overlay_0 brightblack
set -g @thm_overlay_1 brightblack
set -g @thm_overlay_2 brightblack
set -g @thm_subtext_0 white
set -g @thm_subtext_1 white
set -g @thm_rosewater white
set -g @thm_flamingo white
set -g @thm_pink magenta
set -g @thm_mauve magenta
set -g @thm_red red
set -g @thm_maroon red
set -g @thm_peach colour16
set -g @thm_yellow yellow
set -g @thm_green green
set -g @thm_teal cyan
set -g @thm_sky cyan
set -g @thm_sapphire cyan
set -g @thm_blue blue
set -g @thm_lavender blue
set -g @catppuccin_status_background "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text " %d %b • %I:%M %p"

# Window Look & Feel
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_number ""
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I#{?#{!=:#{window_name},},: #W,}"
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},},: #W,}"

# Pane Border Look & Feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=blue"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines heavy


# CRITICAL: Load the plugin BEFORE setting status-left/status-right
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Load custom modules
source -F '#{d:current_file}/custom_modules/ctp_cpu.tmux.conf'
source -F '#{d:current_file}/custom_modules/ctp_memory.tmux.conf'
source -F '#{d:current_file}/custom_modules/primary_ip.tmux.conf'

# Status Line

# Left Status Look & Feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
# cwd basename, shown as ~ when it is $HOME (anchored so a dir merely named like the user is left alone)
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|^$USER$|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag, 󱡴 zoom ,}"

# Right Status Look & Feel
set -g status-right-length 100
set -g @catppuccin_status_right_separator ""
set -g status-right ""
set -agF status-right '#{E:@catppuccin_status_primary_ip} '
set -agF status-right "#{E:@catppuccin_status_ctp_cpu} "
set -agF status-right "#{E:@catppuccin_status_ctp_memory} "
# Battery module only where a battery exists: sysfs glob on Linux (glob-safe with
# zero or several BAT* entries), pmset on macOS.
if 'ls /sys/class/power_supply/BAT* >/dev/null 2>&1 || { command -v pmset >/dev/null 2>&1 && pmset -g batt 2>/dev/null | grep -q InternalBattery; }' {
  set -agF status-right "#{E:@catppuccin_status_battery} "
}
set -agF status-right "#{E:@catppuccin_status_date_time} "


