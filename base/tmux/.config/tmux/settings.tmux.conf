##### Core Settings #####

# Truecolor + styled underlines. Ghostty (TERM=xterm-ghostty) already advertises
# Tc/Smulx/Setulc in terminfo; terminal-features states it explicitly and keeps
# RGB for plain xterm-256color outer terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB:usstyle,xterm-256color:RGB'

# Mouse & clipboard (external: tmux copies set the system clipboard via OSC 52,
# programs inside panes cannot write it)
set -g mouse on
set -g set-clipboard external

# Prefix key (Alt-t)
unbind C-b
set -g prefix M-t
bind M-t send-prefix

# Increase the amount of lines stored in the scroll-back buffer
set -g history-limit 250000

# Customize the title shown in the terminal title
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar settings
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"
set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator '|'

# vi-mode
setw -g mode-keys vi

# don't let programs rename windows via escape sequences
set -g allow-rename off

# server specific options
set -s focus-events on
set -s extended-keys on
set -s escape-time 0

# Bell notifications (Claude Code hooks pass BEL through to Ghostty)
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
