# Global mise config, identical on every machine.
#
# Rule: if `mise registry <tool>` (or a github:/npm:/cargo: backend) can install it, it lives
# here and nowhere else. Packages mise cannot build (fish, stow, tmux, gnupg, GUI apps)
# go in the Brewfile (macOS, WSL) or pkglist/ (Arch, Debian).
#
# Python is deliberately absent: uv manages interpreters.

[tools]
# runtimes
node = "lts"
bun = "latest"
go = "latest"
rust = "stable"
uv = "latest"

# editor, prompt, multiplexers
neovim = "latest"
starship = "latest"
# upstream moved orgs (ogulcancelik -> herdrdev); pinned so a stale registry cannot
# resolve the abandoned repo. Migrate an old install with:
#   mise uninstall --all herdr && mise install herdr
"aqua:herdrdev/herdr" = "latest"
worktrunk = "latest"
"github:joshmedeski/sesh" = "latest"

# cli
lazygit = "latest"
gh = "latest"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
# bat loads custom themes (base/bat) from a cache it refuses to use after a minor upgrade;
# rebuild it with the new bat. `cd /`: bat hides its cache subcommand when the cwd has a "cache".
bat = { version = "latest", postinstall = "cd / && bat cache --build" }
eza = "latest"
delta = "latest"
zoxide = "latest"
jq = "latest"
direnv = "latest"
bottom = "latest"
fastfetch = "latest"
shellcheck = "latest"
shfmt = "latest"
# nvim-treesitter (main) shells out to the tree-sitter CLI to build parsers
tree-sitter = "latest"
"github:YS-L/csvlens" = "latest"
# standalone review TUI (`tuicr -w`, `tuicr pr <n>`); not a pager — delta stays core.pager
"github:agavra/tuicr" = "latest"

# pinned: `npx -y ccstatusline@latest` re-resolves on every status line repaint (~430ms)
"npm:ccstatusline" = "2.2.28"
