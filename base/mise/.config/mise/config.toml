# Global mise config, the same tool list on every machine.
#
# Rule: if `mise registry <tool>` (or a github:/npm:/cargo: backend) can install it, it lives
# here and nowhere else. Packages mise cannot build (fish, stow, tmux, gnupg, GUI apps)
# go in the Brewfile (macOS, WSL) or pkglist/ (Arch, Debian).
#
# Python is deliberately absent: uv manages interpreters.
#
# github: entries are pinned (mise writes the version without the release's `v`): that backend
# fetches release assets straight from GitHub with no registry checksum, unlike aqua:/core.
# To bump one, `gh release list -R owner/repo --limit 3`, edit the version, `mise install`.
# Everything else floats at `latest`; `mise lock --global` would freeze those too (README "Pins").

[tools]
# runtimes
node = "lts"
bun = "latest"
go = "latest"
rust = "stable"
uv = "latest"

# editor, prompt, multiplexers
neovim = "latest"
starship = "latest"
# upstream moved orgs (ogulcancelik -> herdrdev); pinned so a stale registry cannot
# resolve the abandoned repo. Migrate an old install with:
#   mise uninstall --all herdr && mise install herdr
"aqua:herdrdev/herdr" = "latest"
worktrunk = "latest"
"github:joshmedeski/sesh" = "2.29.0"

# cli
lazygit = "latest"
gh = "latest"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
delta = "latest"
zoxide = "latest"
jq = "latest"
direnv = "latest"
bottom = "latest"
fastfetch = "latest"
shellcheck = "latest"
shfmt = "latest"
"github:YS-L/csvlens" = "0.15.1"
# standalone review TUI (`tuicr -w`, `tuicr pr <n>`); not a pager — delta stays core.pager
"github:agavra/tuicr" = "0.25.0"

# pinned: `npx -y ccstatusline@latest` re-resolves on every status line repaint (~430ms)
"npm:ccstatusline" = "2.2.28"
